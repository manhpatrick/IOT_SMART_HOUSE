services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file: ../.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3080
      TRUST_PROXY: 1
    restart: unless-stopped
    expose: ["3080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
  proxy:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN to a public DNS name pointing to this server}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
